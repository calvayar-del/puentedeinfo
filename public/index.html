<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puente</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>puente<span>_</span></h1>
    <div class="whoami" id="whoami">detectando IP…</div>
  </header>
  <p class="sub">Envía texto o archivos. Solo tú los ves hasta que le das <b>Compartir</b> y eliges con qué IP.</p>

  <div class="banner" id="banner"></div>

  <div class="drop" id="dropZone" tabindex="0">
    <textarea id="textIn" placeholder="Escribe o pega texto/imagen aquí (Ctrl+V)…"></textarea>
  </div>
  <div class="row-actions">
    <button class="primary" id="sendTextBtn">Enviar</button>
    <button id="fileBtn">Subir archivo</button>
    <input type="file" id="fileInput">
  </div>

  <div class="log-label"><span>Elementos</span><span id="count"></span></div>
  <div class="items" id="items"></div>
</div>

<div class="modal-backdrop" id="shareBackdrop">
  <div class="modal">
    <h3>Compartir con…</h3>
    <div id="ipList" class="ip-list"></div>
    <div class="modal-actions">
      <button id="shareCancel">Cancelar</button>
      <button class="primary" id="shareConfirm">Compartir</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
